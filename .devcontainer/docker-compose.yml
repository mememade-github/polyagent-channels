x-channel-logging: &channel-logging
  driver: local
  options:
    max-size: "${CHANNEL_LOG_MAX_SIZE:-10m}"
    max-file: "${CHANNEL_LOG_MAX_FILES:-3}"
    compress: "true"

services:
  polyagent-channels:
    container_name: ${INSTANCE_NAME:-polyagent-channels}
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    user: vscode
    working_dir: /workspaces
    environment:
      SKIP_CLAUDE_UPDATE: "1"
      SKIP_CODEX_UPDATE: "1"
      SKIP_AGY_UPDATE: "1"
      CHANNEL_URL: http://127.0.0.1:8080
      CHANNEL_MAX_STORAGE_BYTES: "${CHANNEL_MAX_STORAGE_BYTES-1073741824}"
      CHANNEL_RETENTION_DAYS: "${CHANNEL_RETENTION_DAYS-7}"
      REDIS_URL: redis://redis:6379/0
      CHANNEL_KEY_FILE: /workspaces/.env/channel.key
    ports:
      - "${CHANNEL_BIND:-0.0.0.0}:${CHANNEL_PORT:-18765}:8080"
    volumes:
      - type: bind
        source: ${HOST_WORKSPACE_PATH:-..}
        target: /workspaces
    depends_on:
      redis:
        condition: service_healthy
    logging: *channel-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--auto-aof-rewrite-percentage", "${REDIS_AOF_REWRITE_PERCENTAGE:-50}",
              "--auto-aof-rewrite-min-size", "${REDIS_AOF_REWRITE_MIN_SIZE:-64mb}",
              "--save", ""]
    volumes:
      - channel-data:/data
    logging: *channel-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  channel-data:
